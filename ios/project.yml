name: Asclepius

options:
  bundleIdPrefix: com.asclepius
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Asclepius:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Asclepius/Sources
      - path: Asclepius/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asclepius.app
        PRODUCT_NAME: Asclepius
        CODE_SIGN_ENTITLEMENTS: Asclepius/Asclepius.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SUPPORTS_MACCATALYST: NO
        # Set DEVELOPMENT_TEAM here (or in Xcode's Signing pane) before building
        # on a device: DEVELOPMENT_TEAM: ABCDE12345
      configs:
        Debug:
          # Point the app at a local backend while developing.
          ASCLEPIUS_API_BASE_URL: "http://localhost:8765"
        Release:
          ASCLEPIUS_API_BASE_URL: "https://api.asclepius.health"
    info:
      path: Asclepius/Info.plist
      properties:
        CFBundleDisplayName: Asclepius
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # The API base URL AppConfig reads. Overridden per build configuration
        # via the ASCLEPIUS_API_BASE_URL build setting above.
        AsclepiusAPIBaseURL: "$(ASCLEPIUS_API_BASE_URL)"
        NSHealthShareUsageDescription: >-
          Asclepius reads your activity, heart, body, and sleep data from Apple
          Health so your AI coach can track trends and personalize your plan.
        NSHealthUpdateUsageDescription: >-
          Asclepius does not write data to Apple Health today, but may offer to
          save workouts and nutrition you log in the app.
        NSCameraUsageDescription: >-
          Take a photo of your meal and Asclepius will estimate its calories
          and macros for your food log.
        NSPhotoLibraryUsageDescription: >-
          Choose a photo of your meal and Asclepius will estimate its calories
          and macros for your food log.
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.asclepius.app.refresh
          - com.asclepius.app.sync
        NSAppTransportSecurity:
          # Allows the http://localhost backend during development; production
          # traffic is HTTPS and unaffected.
          NSAllowsLocalNetworking: true
