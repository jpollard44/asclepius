<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10302b"/>
      <stop offset="1" stop-color="#0b1413"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Rod of Asclepius: a white staff with a teal serpent coiled around it. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- staff -->
    <line x1="256" y1="104" x2="256" y2="416" stroke="#f3faf8" stroke-width="22"/>
    <!-- staff knob -->
    <circle cx="256" cy="104" r="17" fill="#f3faf8" stroke="none"/>
    <!-- serpent coiling the staff -->
    <path d="M256 150
             C 318 168, 318 214, 256 232
             C 194 250, 194 296, 256 314
             C 318 332, 318 378, 256 396"
          stroke="#2dd4bf" stroke-width="20"/>
    <!-- serpent head -->
    <circle cx="252" cy="404" r="13" fill="#2dd4bf" stroke="none"/>
  </g>
</svg>
